name: Deploy Full-Stack Portfolio to cPanel

on:
  push:
    branches: ["main"]

jobs:
  build-and-deploy-frontend:
    name: Build & Deploy Frontend (Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Frontend Dependencies & Build
        run: |
          cd Frontend
          npm install
          npm run build
        env:
          VITE_API_BASE_URL: https://demeportfolio_backend.neyasoft.com/api

      - name: Upload Frontend dist to cPanel via FTP
        uses: SamKirsch/ftp-deploy-action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./Frontend/dist/
          server-dir: ./public_html/demeportfolio/

  deploy-backend:
    name: Deploy Backend & Run Prisma (Node.js)
    runs-on: ubuntu-latest
    needs: build-and-deploy-frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: SSH into cPanel and Update Backend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd public_html/demeportfolio_backend

            # Pull latest backend code changes
            git pull origin main

            # Install production & dev dependencies (needed for tsc build)
            npm install

            # Run Prisma Client generation against live database
            npx prisma generate

            # Compile TypeScript backend files
            npm run build

            # Trigger cPanel Passenger Node.js app restart
            mkdir -p tmp
            touch tmp/restart.txt

            echo "Backend successfully deployed and restarted!"
